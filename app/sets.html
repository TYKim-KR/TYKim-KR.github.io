<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<!-- 통신 금지 규칙: 이 페이지는 어디로도 요청을 보내지 못한다(fetch·XHR·WebSocket·이미지·폼 전부 막힘). 스크립트는 이 사이트 파일과 텔레그램 공식 스크립트만. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://telegram.org; style-src 'self'; img-src 'none'; font-src 'none'; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'none'; base-uri 'none'; form-action 'none'">
<title>세트 넣기</title>
<!-- 종목과 첫 값은 주소 # 뒤에서만 읽는다(서버로 안 감, 사람 이름·신체 수치 없음). 넣은 세트는 텔레그램 봇으로만 보낸다. initData는 읽지 않는다. -->
<link rel="stylesheet" href="sets.css?v=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div id="head">🏋️ 세트 넣기</div>
<div id="tabs" class="chips"></div>
<div id="editor">
  <div class="stepper" id="wBox">
    <button id="wMinus">−</button><span id="wVal" class="val"></span><button id="wPlus">+</button>
  </div>
  <div class="stepper">
    <button id="rMinus">−</button><span id="rVal" class="val"></span><button id="rPlus">+</button>
  </div>
  <button id="addSet" class="primary">＋ 세트 추가</button>
</div>
<div id="rirBox" hidden>
  <div id="rirName" class="tname"></div>
  <div class="rirBtns"><button id="rir0">0</button><button id="rir1">1~2</button><button id="rir3">3+</button><button id="rirSkip">건너뛰기</button></div>
</div>
<div id="timer" hidden>
  <div id="timerName" class="tname"></div>
  <div id="timerVal"></div>
  <div class="timerBtns"><button id="tMinus">−15초</button><button id="tStop">끝</button><button id="tPlus">+15초</button></div>
</div>
<div id="sets"></div>
<div id="info"></div>
<script src="sets-math.js?v=1"></script>
<script src="sets.js?v=1"></script>
</body>
</html>
